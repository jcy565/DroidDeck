name: Independent AI Android source check
on:
  push:
    branches: [ai-independent-apk-verification-next]
    paths:
      - '.github/workflows/ai-android-source-check.yml'
      - 'app/src/localAi/java/**'
      - 'app/src/noLocalAi/java/**'
      - 'app/src/main/java/com/droiddeck/launcher/files/GamePatchDialog.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameAgent.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/ImageAssetDecoder.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/ImagePatch*.kt'
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore reviewed pack inputs for Gradle configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jcy565/DroidDeck/actions/artifacts/15250168311/zip > "$RUNNER_TEMP/packs.zip"
          echo "ebe86c44c92a47a5b25807e22712dd5d14c778b83ff754131e1801e8617c1579  $RUNNER_TEMP/packs.zip" | sha256sum -c -
          mkdir -p app/build/packs
          unzip -q "$RUNNER_TEMP/packs.zip" -d app/build/packs
      - name: Compile standard AI screens and OCR integration
        run: |
          ./gradlew :app:compileReleaseKotlin --console=plain --max-workers=2 \
            -PexperimentalImageOcr=true -PskipRust=true -x :app:buildVkBridgeServer
      - name: Compile the opt-in local inference adapter
        run: |
          ./gradlew :app:compileReleaseKotlin --console=plain --max-workers=2 \
            -PexperimentalImageOcr=true -PexperimentalLocalAi=true -PskipRust=true -x :app:buildVkBridgeServer
      - name: Inspect inference SDK ARM64 libraries and published license metadata
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile

          sdk = Path.home() / ".gradle/caches/modules-2/files-2.1/com.google.mediapipe/tasks-genai"
          archives = list(sdk.glob("*/*/tasks-genai-*.aar"))
          if len(archives) != 1:
              raise ValueError(f"Expected one resolved inference AAR, found {archives}")
          archive = archives[0]
          with archive.open("rb") as source:
              print(archive.name, "SHA-256", hashlib.file_digest(source, "sha256").hexdigest())
          with ZipFile(archive) as package:
              libraries = [p for p in package.namelist() if p.startswith("jni/arm64-v8a/") and p.endswith(".so")]
              if not libraries:
                  raise ValueError("Inference AAR has no ARM64 JNI library")
              for name in libraries:
                  with package.open(name) as library:
                      header = library.read(20)
                  if header[:6] != b"\x7fELF\x02\x01" or int.from_bytes(header[18:20], "little") != 183:
                      raise ValueError(f"Expected 64-bit little-endian AArch64 ELF: {name}")
                  print("AArch64", name)
          for pom in archive.parent.parent.glob("*/*.pom"):
              for license in ElementTree.parse(pom).findall(".//{*}licenses/{*}license"):
                  print("SDK POM license:", license.findtext("{*}name"), license.findtext("{*}url"))
          PY
