name: AI integrated Rust regression
on:
  push:
    branches: [ai-0711-integration-next]
    paths:
      - '.github/workflows/ai-rust-security-update-candidate.yml'
      - 'app/src/main/rust/stores/**'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact reviewed lock and manifest
        run: |
          set -euo pipefail
          cd app/src/main/rust/stores
          echo 'c8d0a99d1c143b78c85024ed8a247efafc473d8fdeddbfc6196e022fa3b54cb1  Cargo.lock' | sha256sum -c -
          echo '25fca5ad92be52449d8b57b0df0a7bd3277e988a89ee403b693d7d2ffbfd3909  Cargo.toml' | sha256sum -c -
      - name: Test integrated store engine without Android packaging
        run: |
          set -euo pipefail
          cd app/src/main/rust/stores
          cargo +stable test --locked
          git diff --exit-code -- Cargo.lock Cargo.toml
