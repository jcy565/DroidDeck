name: Independent AI APK verification
on:
  push:
    branches: [ai-independent-apk-verification-next]
    paths:
      - '.github/workflows/ai-independent-apk-verification.yml'
      - 'tools/ci/verify-development-apk.py'
      - 'tools/ci/apk_signer_report.py'
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and pin the previously completed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jcy565/DroidDeck
          gh api repos/jcy565/DroidDeck/actions/runs/46139567549 > run.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "fc57f72eca36b3930177bc521b752dfeca230044"' run.json
          gh api repos/jcy565/DroidDeck/actions/artifacts/15262040627/zip > reviewed.zip
          gh api repos/jcy565/DroidDeck/actions/artifacts/15260609118/zip > inventory.zip
      - name: Verify pinned archives, APK contents, signer and package version
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          python3 tools/ci/verify-development-apk.py reviewed.zip inventory.zip \
            fc57f72eca36b3930177bc521b752dfeca230044 \
            --apk-zip-sha256 025601fc7965048da4f658f9ecf76c58b3cb89b80a8061a400d177d127a7245f \
            --inventory-zip-sha256 ca97d5371b6f577c4f2f22c28c2952e3a6c8fcc8dc10c71b6a8604759c1c55c6 \
            --apksigner "$tools/apksigner" --aapt "$tools/aapt" --expected-version-code 19 \
            --expected-cert-sha256 a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc \
            | tee verification.json
          jq -e '.apk_sha256 == "8c10d68b3a9e9e48b1caab45299ffda436f2cb18a03577f82ff6e959b10889b6"' verification.json
          cat verification.json >> "$GITHUB_STEP_SUMMARY"
