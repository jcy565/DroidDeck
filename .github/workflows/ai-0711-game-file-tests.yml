name: AI 0.7.11 game file regression
on:
  push:
    branches: [ai-0711-integration-next]
    paths:
      - '.github/workflows/ai-0711-game-file-tests.yml'
      - 'app/src/main/java/com/droiddeck/launcher/files/GamePatch*.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameConfigPreview.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/LocalGameAdvisor.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameFileAnalysis.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/GameFileAnalysisTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameSettingsApproval.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/GameSettingsApprovalTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/Translation*.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/GamePatch*.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/TranslationJsonTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/compatibility/OptimizationComparison.kt'
      - 'app/src/test/java/com/droiddeck/launcher/compatibility/OptimizationComparisonTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/compatibility/InstalledGameVersion.kt'
      - 'app/src/test/java/com/droiddeck/launcher/compatibility/InstalledGameVersionTest.kt'
      - 'ai-core/src/main/java/**'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile ported AI Core and run standalone Kotlin regression
        run: |
          set -euo pipefail
          javac -version
          kotlinc -version
          mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get -Dartifact=junit:junit:4.13.2
          deps="$HOME/.m2/repository"
          cp="$deps/junit/junit/4.13.2/junit-4.13.2.jar:$deps/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          mkdir -p "$RUNNER_TEMP/ai-core"
          javac --release 17 -proc:none -encoding UTF-8 -d "$RUNNER_TEMP/ai-core" ai-core/src/main/java/com/droiddeck/ai/core/{AiCore,ModelRelease,GlossaryStore,SignedGlossary}.java
          src=app/src/main/java/com/droiddeck/launcher/files
          tests=app/src/test/java/com/droiddeck/launcher/files
          kotlinc "$src"/{TranslationLimits,TranslationJson,TranslationTable,GamePatchStore,GameConfigPreview,LocalGameAdvisor,GamePatchAuthor,TranslationDraftStore,GameFileAnalysis,GameSettingsApproval}.kt \
            "$tests"/{GamePatchTest,GamePatchAuthorTest,TranslationJsonTest,GameFileAnalysisTest,GameSettingsApprovalTest}.kt \
            app/src/main/java/com/droiddeck/launcher/compatibility/OptimizationComparison.kt \
            app/src/test/java/com/droiddeck/launcher/compatibility/OptimizationComparisonTest.kt \
            app/src/main/java/com/droiddeck/launcher/compatibility/InstalledGameVersion.kt \
            app/src/test/java/com/droiddeck/launcher/compatibility/InstalledGameVersionTest.kt \
            -jvm-target 17 -classpath "$cp:$RUNNER_TEMP/ai-core" -d "$RUNNER_TEMP/game-files.jar"
          kotlin -classpath "$RUNNER_TEMP/game-files.jar:$cp:$RUNNER_TEMP/ai-core" org.junit.runner.JUnitCore \
            com.droiddeck.launcher.files.GamePatchTest \
            com.droiddeck.launcher.files.GamePatchAuthorTest \
            com.droiddeck.launcher.files.TranslationJsonTest \
            com.droiddeck.launcher.files.GameFileAnalysisTest \
            com.droiddeck.launcher.files.GameSettingsApprovalTest \
            com.droiddeck.launcher.compatibility.OptimizationComparisonTest \
            com.droiddeck.launcher.compatibility.InstalledGameVersionTest
