name: AI Rust dependency audit
on:
  push:
    branches: [ai-0711-integration-next]
    paths:
      - '.github/workflows/ai-rust-dependency-audit.yml'
      - 'app/src/main/rust/stores/Cargo.lock'
      - 'app/src/main/rust/stores/Cargo.toml'
      - 'tools/*-launcher/Cargo.lock'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory all four reviewed Rust lockfiles
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jcy565/DroidDeck
          out="$RUNNER_TEMP/rust-audit"
          mkdir -p "$out/input" "$out/report"
          while read -r name path expected; do
            test "$(git hash-object "$path")" = "$expected"
            cp "$path" "$out/input/$name.lock"
            sha256sum "$out/input/$name.lock" >> "$out/report/lock-sha256.txt"
          done <<'LOCKS'
          stores app/src/main/rust/stores/Cargo.lock 6a470b3beae093190d06da5b224492083bf641f5
          epic tools/epic-launcher/Cargo.lock 569575bb0915e1d5aa103a4edeb46afd4184ec18
          rockstar tools/rockstar-launcher/Cargo.lock f73866571d6690ff686e487742c7035c6c9aa21b
          ubisoft tools/ubisoft-launcher/Cargo.lock a2bc2229eae56d91b145e3c435e8433dc8b7348c
          LOCKS
          printf '%s\n' "$GITHUB_SHA" > "$out/report/reviewed-source.txt"
      - name: Install pinned scanner outside the project
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rust-audit"
          cargo +stable install cargo-audit --version '=0.23.0' --locked --root "$RUNNER_TEMP/rust-audit/tool"
          "$RUNNER_TEMP/rust-audit/tool/bin/cargo-audit" audit --version | tee report/scanner-version.txt
      - name: Scan each lockfile against RustSec
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rust-audit"
          export PATH="$RUNNER_TEMP/rust-audit/tool/bin:$PATH"
          failed=0
          for name in stores epic rockstar ubisoft; do
            status=0
            cargo +stable audit --file "input/$name.lock" --json > "report/$name-audit.json" || status=$?
            printf '%s\n' "$status" > "report/$name-exit-code.txt"
            if ! jq -e '(.vulnerabilities | type == "object") and (.warnings | type == "object")' "report/$name-audit.json" >/dev/null; then
              failed=1
            fi
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-rust-dependency-audit
          path: ${{ runner.temp }}/rust-audit/report/
          if-no-files-found: error
          retention-days: 30
