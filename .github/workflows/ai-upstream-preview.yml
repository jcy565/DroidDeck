name: AI upstream update preview
on:
  push:
    branches: [ai-0711-integration-next]
    paths:
      - '.github/workflows/ai-upstream-preview.yml'
      - 'tools/ci/ai_upstream_preview.py'
      - 'tools/ci/ai_upstream_candidate.py'
      - 'tools/ci/test_ai_upstream_candidate.py'
      - 'tools/ci/ai_upstream_repair.py'
      - 'tools/ci/test_ai_upstream_repair.py'
      - 'tools/ci/ai_upstream_apply.py'
      - 'tools/ci/test_ai_upstream_apply.py'
      - 'tools/ci/ai_upstream_artifact.py'
      - 'tools/ci/test_ai_upstream_artifact.py'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative merge candidate generation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p 'test_ai_upstream_*.py' -v
      - name: Preview pinned integration inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jcy565/DroidDeck
          mkdir -p "$RUNNER_TEMP/upstream-preview"
          ai=4cca491bd6897e39112967c36e78baf8eee06de2
          upstream=c6169cba808d82f4d247b00bf01827506c1db54d
          git cat-file -e "$ai^{commit}"
          git cat-file -e "$upstream^{commit}"
          status=0
          PYTHONDONTWRITEBYTECODE=1 python3 tools/ci/ai_upstream_candidate.py --ai "$ai" --upstream "$upstream" > "$RUNNER_TEMP/upstream-preview/report.json" || status=$?
          jq -e --arg ai "$ai" --arg upstream "$upstream" '.ai == $ai and .upstream == $upstream and .release_approved == false' "$RUNNER_TEMP/upstream-preview/report.json"
          jq '{merge_status,next,candidate_status,candidate_tree,ai_count:(.ai_changed|length),upstream_count:(.upstream_changed|length),conflict_count:(.conflicts|length),review_count:(.sensitive_review|length)}' "$RUNNER_TEMP/upstream-preview/report.json"
          repair_status=0
          PYTHONDONTWRITEBYTECODE=1 python3 tools/ci/ai_upstream_repair.py --ai "$ai" --upstream "$upstream" > "$RUNNER_TEMP/upstream-preview/repairs.json" || repair_status=$?
          jq -e --arg ai "$ai" --arg upstream "$upstream" '.ai == $ai and .upstream == $upstream and .repair_applied == false and .release_approved == false' "$RUNNER_TEMP/upstream-preview/repairs.json"
          jq '{suggestions:(.repair_suggestions|length),unresolved:(.unresolved_conflicts|length)}' "$RUNNER_TEMP/upstream-preview/repairs.json"
          apply_status=0
          PYTHONDONTWRITEBYTECODE=1 python3 tools/ci/ai_upstream_apply.py --ai "$ai" --upstream "$upstream" > "$RUNNER_TEMP/upstream-preview/candidate.json" || apply_status=$?
          jq -e --arg ai "$ai" --arg upstream "$upstream" '.ai == $ai and .upstream == $upstream and .release_approved == false' "$RUNNER_TEMP/upstream-preview/candidate.json"
          jq '{candidate_status,candidate_tree,repair_applied_to_candidate}' "$RUNNER_TEMP/upstream-preview/candidate.json"
          test -z "$(git status --porcelain)"
          test "$status" -eq "$(jq 'if .candidate_status == "blocked" then 1 else 0 end' "$RUNNER_TEMP/upstream-preview/report.json")"
          test "$repair_status" -eq "$(jq 'if (.conflicts|length)>0 then 1 else 0 end' "$RUNNER_TEMP/upstream-preview/repairs.json")"
          test "$apply_status" -eq "$(jq 'if .candidate_status == "blocked" then 1 else 0 end' "$RUNNER_TEMP/upstream-preview/candidate.json")"
          if [ "$(jq -r .candidate_status "$RUNNER_TEMP/upstream-preview/candidate.json")" = regression_required ]; then
            out="$RUNNER_TEMP/upstream-preview/verified-candidate"
            PYTHONDONTWRITEBYTECODE=1 python3 tools/ci/ai_upstream_artifact.py export --ai "$ai" --upstream "$upstream" --output "$out"
            PYTHONDONTWRITEBYTECODE=1 python3 tools/ci/ai_upstream_artifact.py verify --ai "$ai" --upstream "$upstream" --output "$out"
            jq -e --arg tree "$(jq -r .candidate_tree "$RUNNER_TEMP/upstream-preview/candidate.json")" '.candidate_tree == $tree and .release_approved == false' "$out/manifest.json"
          fi
          test -z "$(git status --porcelain)"
          exit "$apply_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-upstream-preview
          path: ${{ runner.temp }}/upstream-preview/
          if-no-files-found: error
          retention-days: 30
