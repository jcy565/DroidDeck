name: AI game file tests
on:
  push:
    branches: [ai-independent-apk-verification-next, ai-image-cancellation-staging-next, ai-image-encoding-staging-next]
    paths:
      - '.github/workflows/ai-game-file-tests.yml'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameConfigPreview.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/LocalGameAdvisor.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GamePatch*.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/FolderUsage.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/Translation*.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/GamePatch*.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/TranslationDraftStoreTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/GameAgent.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/LocalModelStore.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/ImagePatch*.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/Dds*.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/TgaImage.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/ImageTranslationInput.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/Dds*Test.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/TgaImageTest.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/ImagePatch*.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/LocalModelStoreTest.kt'
      - 'app/src/main/java/com/droiddeck/launcher/files/AiHostBridge.kt'
      - 'app/src/test/java/com/droiddeck/launcher/files/GameAgentTest.kt'
      - 'ai-core/src/main/java/com/droiddeck/ai/core/AiCore.java'
permissions:
  contents: read
jobs:
  game-file-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile game file code and run JVM regression tests
        run: |
          set -euo pipefail
          mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get -Dartifact=junit:junit:4.13.2
          mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get -Dartifact=org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3
          deps="$HOME/.m2/repository"
          cp="$deps/junit/junit/4.13.2/junit-4.13.2.jar:$deps/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          javac -d "$RUNNER_TEMP/ai-core" ai-core/src/main/java/com/droiddeck/ai/core/AiCore.java
          cp="$cp:$RUNNER_TEMP/ai-core:$deps/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.7.3/kotlinx-coroutines-core-jvm-1.7.3.jar"
          src=app/src/main/java/com/droiddeck/launcher/files
          tests=app/src/test/java/com/droiddeck/launcher/files
          kotlinc "$src"/{GameConfigPreview,GamePatchStore,GamePatchAuthor,LocalGameAdvisor,FolderUsage,GameAgent,LocalModelStore,ImagePatchArchive,ImagePatchImport,ImagePatchBackup,ImagePatchTransaction,ImagePatchReview,ImagePatchPngCheck,ImagePatchPngStream,ImagePatchStorageCheck,DdsImage,DdsCopyEncoder,DdsCopyReview,TgaImage,ImageTranslationInput,AiHostBridge,TranslationAgentWindow,TranslationJson,TranslationLimits,TranslationTable,TranslationDraftStore}.kt \
            "$tests"/{GamePatchTest,GamePatchAuthorTest,GameAgentTest,LocalModelStoreTest,ImagePatchArchiveTest,ImagePatchTransactionTest,ImagePatchPngCheckTest,ImagePatchStorageCheckTest,DdsImageTest,DdsCopyEncoderTest,TgaImageTest,TranslationDraftStoreTest}.kt -classpath "$cp" -d "$RUNNER_TEMP/game-files.jar"
          kotlin -classpath "$RUNNER_TEMP/game-files.jar:$cp" org.junit.runner.JUnitCore \
            com.droiddeck.launcher.files.GamePatchTest com.droiddeck.launcher.files.GamePatchAuthorTest com.droiddeck.launcher.files.GameAgentTest com.droiddeck.launcher.files.LocalModelStoreTest com.droiddeck.launcher.files.ImagePatchArchiveTest com.droiddeck.launcher.files.ImagePatchTransactionTest com.droiddeck.launcher.files.ImagePatchPngCheckTest com.droiddeck.launcher.files.ImagePatchStorageCheckTest com.droiddeck.launcher.files.DdsImageTest com.droiddeck.launcher.files.DdsCopyEncoderTest com.droiddeck.launcher.files.TgaImageTest com.droiddeck.launcher.files.TranslationDraftStoreTest
