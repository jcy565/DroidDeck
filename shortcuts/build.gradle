plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droiddeck.shortcuts'
    compileSdk 34

    defaultConfig {
        applicationId 'com.droiddeck.shortcuts.ai'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 3
        versionName '3'
    }

    sourceSets.main.java.srcDir('src/protocol/java')

    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply from: rootProject.file('gradle/ai-signing.gradle')
